name: ai-rag-demo

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    <<: *runtime
    image: mysql:8.0.40
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run deploy.sh first}
      MYSQL_DATABASE: ai_rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run deploy.sh first}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run deploy.sh first}
      TZ: Asia/Shanghai
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40", "--performance-schema=OFF", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ai_rag.sql:/seed/ai_rag.sql:ro
      - ./deploy/mysql-init.sh:/docker-entrypoint-initdb.d/20-demo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -urag ai_rag -Nse 'SELECT id FROM _deployment_state WHERE id=1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 768m

  postgres:
    <<: *runtime
    image: pgvector/pgvector:pg18-bookworm
    environment:
      POSTGRES_DB: ai_rag_vector
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy.sh first}
      TZ: Asia/Shanghai
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./ai_rag_vector.sql:/docker-entrypoint-initdb.d/10-vectors.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h127.0.0.1 -U rag -d ai_rag_vector -v ON_ERROR_STOP=1 -Atc 'SELECT count(*) FROM knowledge_chunk_vector WHERE false' | grep -qx 0"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 512m

  backend:
    <<: *runtime
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ai_rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run deploy.sh first}
      MYSQL_POOL_MAX: "5"
      POSTGRES_HOST: postgres
      POSTGRES_DB: ai_rag_vector
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy.sh first}
      JWT_SECRET: ${JWT_SECRET:?Run deploy.sh first}
      SQL_ECHO: "false"
      DOWNLOAD_PREFIX: /api/files/download/
      UPLOAD_DIR: /app/files
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/files
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:9090/',timeout=4)); assert r['code']=='200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1536m

  web:
    <<: *runtime
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/secrets/demo.htpasswd:/etc/nginx/demo.htpasswd:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -q '401 Unauthorized'"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m

volumes:
  mysql_data:
  postgres_data:
  uploads:
